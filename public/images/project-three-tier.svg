<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071426"/><stop offset="100%" stop-color="#102C50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#g4)"/>
  <rect x="45" y="45" width="710" height="360" rx="18" fill="#0B1F3A" fill-opacity="0.55" stroke="#22D3EE" stroke-opacity="0.35" stroke-dasharray="8 6" stroke-width="2"/>
  <text x="72" y="78" fill="#22D3EE" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AWS VPC • THREE-TIER HIGH-AVAILABILITY ARCHITECTURE</text>
