  <text x="137" y="262" text-anchor="middle" fill="#C2D4E8" font-family="Inter, sans-serif" font-size="11">Traffic Routing</text>
  <!-- Tier 1: Web -->
  <rect x="240" y="110" width="145" height="240" rx="14" fill="#102C50" stroke="#2563EB" stroke-width="2"/>
