  <rect x="260" y="162" width="105" height="70" rx="10" fill="#071426" stroke="#2563EB"/>
  <text x="312" y="195" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Nginx</text>
  <text x="312" y="215" text-anchor="middle" fill="#C2D4E8" font-family="Inter, sans-serif" font-size="11">Public Subnet</text>
  <rect x="260" y="250" width="105" height="70" rx="10" fill="#071426" stroke="#2563EB"/>
  <text x="312" y="283" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">EC2 Web</text>
  <text x="312" y="303" text-anchor="middle" fill="#C2D4E8" font-family="Inter, sans-serif" font-size="11">Frontend Tier</text>
